# Run a sweep file on GitHub-hosted runners, one job per line (free and unlimited for public repos).
#   gh workflow run sweep.yml --ref modernize -f sweep=sweeps/e7_cue.txt [-f lines=2-40] [-f larry=true]
#   gh run download <run id> -n results -D .      # results land at their sweep-file paths
name: Sweep

on:
  workflow_dispatch:
    inputs:
      sweep:
        description: sweep file under sweeps/
        required: true
      lines:
        description: optional line filter, e.g. 3,5,10-20
        default: ""
      larry:
        description: download the LARRY datasets (fit_larry / fit_cytokine / clone-ES sweeps)
        type: boolean
        default: false
      petracer:
        description: download the PEtracer embryo trees + TRAIN-embryo GEO matrices (C14 train-only scripts)
        type: boolean
        default: false
      lsc:
        description: download the LSC LARRY D20 files (Zenodo 18444428) + committed clone map (C12 train-only scripts)
        type: boolean
        default: false
      chspctrack:
        description: download the cHSPCTrack cells h5ad (public S3; oracle count functions only, QS2-R1-P1)
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.list.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          args=""; [ -n "${{ inputs.lines }}" ] && args="--lines ${{ inputs.lines }}"
          echo "lines=$(python3 experiments/sweep.py '${{ inputs.sweep }}' --list $args)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.lines) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra fit
      - name: Cache LARRY data
        if: inputs.larry
        uses: actions/cache@v4
        with:
          path: data
          key: larry-data-v1
      - name: LARRY data
        if: inputs.larry
        run: |
          base=https://kleintools.hms.harvard.edu/paper_websites/state_fate2020/
          for pair in larry:inVitro larry_invivo:inVivo larry_cytokine:cytokinePerturbation; do
            dir=data/${pair%%:*}; mkdir -p "$dir"
            for f in clone_matrix.mtx.gz metadata.txt.gz; do
              [ -s "$dir/$f" ] || curl -sfL -o "$dir/$f" "${base}stateFate_${pair##*:}_$f"
            done
          done
      - name: PEtracer train data (public Zenodo + GEO; scripts read train embryos only)
        if: inputs.petracer
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h . | tail -1
          mkdir -p data/ext_petracer/raw data/ext_petracer/train_matrices
          curl -sfL --retry 3 -o data/ext_petracer/raw/E7.5-E10_trees.h5td \
            https://zenodo.org/api/records/23088914/files/E7.5-E10_trees.h5td/content
          curl -sfL --retry 3 -o data/ext_petracer/raw/E7.5-E10_spatial_scores.csv \
            https://zenodo.org/api/records/23088914/files/E7.5-E10_spatial_scores.csv/content
          for f in $(awk '{print $2}' sweeps/petracer_train_data.sha256 | grep train_matrices); do
            n=$(basename "$f"); gsm=${n%%_*}
            curl -sfL --retry 3 -o "$f" "https://ftp.ncbi.nlm.nih.gov/geo/samples/${gsm:0:7}nnn/$gsm/suppl/$n"
          done
          sha256sum -c sweeps/petracer_train_data.sha256
          source .venv/bin/activate
          uv pip install h5py scikit-learn pandas
      - name: LSC LARRY data (public Zenodo; scripts read train clones only)
        if: inputs.lsc
        run: |
          mkdir -p data/ext_lsc_larry/raw
          for f in $(awk '{print $2}' sweeps/lsc_data.sha256 | grep /raw/); do
            curl -sfL --retry 3 -o "$f" "https://zenodo.org/api/records/18444428/files/$(basename "$f")/content"
          done
          cp sweeps/lsc_clone_map_d20.tsv data/ext_lsc_larry/clone_map_d20.tsv
          sha256sum -c sweeps/lsc_data.sha256
          source .venv/bin/activate
          uv pip install scikit-learn pandas scipy
      - name: cHSPCTrack data (public S3; read only through test_oracle count functions)
        if: inputs.chspctrack
        run: |
          df -h . | tail -1
          mkdir -p data/ext_chspctrack
          for f in $(awk '{print $2}' sweeps/chspctrack_data.sha256); do
            curl -sfL --retry 3 -o "$f" "https://chspctrack.s3.amazonaws.com/cHSPCTrack/$(basename "$f")"
          done
          sha256sum -c sweeps/chspctrack_data.sha256
          source .venv/bin/activate
          uv pip install h5py scikit-learn pandas
      - name: Run line ${{ matrix.line }}
        run: |
          source .venv/bin/activate  # lines may call plain python or uv run
          python experiments/sweep.py '${{ inputs.sweep }}' --lines ${{ matrix.line }} --threads 4 --logdir sweep_logs
          cat sweep_logs/*.log | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-${{ matrix.line }}
          path: |
            experiments/results_*/
            sweep_logs/
          retention-days: 14

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: line-*
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: .
          retention-days: 30
