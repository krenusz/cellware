[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cellware"
version = "0.2.0.dev0"
description = "Multi-agent reinforcement learning simulation of stem-cell fate decisions and tissue patterning"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bence Krénusz", email = "bence.krenusz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
viz = ["matplotlib>=3.8"]
legacy = ["ray>=2.10", "pandas>=2.2", "tensorboard", "threadpoolctl", "matplotlib>=3.8"]
fit = [
    "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cellware"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

# CPU-only torch wheels: the local GT 1030 (Pascal) is unsupported by current CUDA builds,
# and training is meant to run on cloud GPUs where the default index is fine.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
